[project]
name = "ci-cd-calculator"
version = "1.0.0"
description = "Simple calculator project with tests and CI/CD on GitHub Actions"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Student", email = "student@example.com"}]

[tool.pytest.ini_options]
addopts = "-q --maxfail=1 --disable-warnings"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.coverage.run]
source = ["calculator"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
